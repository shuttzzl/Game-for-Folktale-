def element(parent, tag, text="", **attrs):
    node = document.createElement(tag)
    for key, value in attrs.items():
        node.setAttribute(key.replace("_", "-"), value)
    node.textContent = text
    parent.appendChild(node)
    return node

class Line:
    def __init__(self, text, kind, complete):
        self.text = text
        self.kind = kind
        self.complete = complete
        self.node = None
        self.offset = 0


class TextQueue:
    def __init__(self, log, motion):
        self.log = log
        self.motion = motion
        self.pending = []
        self.frame = None
        self.last_tick = 0

    def write(self, text, kind="", complete=None, immediate=False):
        self.pending.append(Line(text, kind, complete))
        if immediate or self.motion.matches:
            self.finish()
        elif self.frame is None:
            self.log.setAttribute("aria-busy", "true")
            self.last_tick = window.performance.now()
            self.draw(1)
            if self.pending:
                self.frame = window.requestAnimationFrame(self.tick)

    def draw(self, count):
        log = self.log
        at_bottom = log.scrollHeight - log.clientHeight - log.scrollTop <= 3
        while self.pending and count > 0:
            line = self.pending[0]
            if line.node is None:
                line.node = element(log, "p")
                line.node.className = line.kind
            take = min(count, len(line.text) - line.offset)
            line.offset += take
            count -= take
            line.node.textContent = line.text[:line.offset]
            if line.offset == len(line.text):
                self.pending.pop(0)
                if line.complete:
                    line.complete()
        if at_bottom:
            log.scrollTop = log.scrollHeight
        if not self.pending:
            log.setAttribute("aria-busy", "false")

    def tick(self, now):
        self.frame = None
        count = int((now - self.last_tick) / 15)
        if count > 0:
            self.last_tick += count * 15
            self.draw(count)
        if self.pending:
            self.frame = window.requestAnimationFrame(self.tick)

    def finish(self):
        if self.frame is not None:
            window.cancelAnimationFrame(self.frame)
            self.frame = None
        self.draw(sum(len(line.text) - line.offset for line in self.pending))


class Sound:
    def __init__(self):
        self.clips = {}
        for number in (4, 5, 7, 14, 15, 17):
            clip = document.createElement("audio")
            clip.preload = "auto"
            clip.src = f"audio/{number:02d}.mp3"
            self.clips[number] = clip
        self.music = self.clips[14]
        self.music.volume = 0.04
        self.music.loop = True
        self.muted = False
        self.effect = None

    @staticmethod
    def play(clip):
        promise = clip.play()
        if hasattr(promise, "catch"):
            promise.catch(lambda *_: None)

    @staticmethod
    def stop(clip):
        if clip is not None:
            clip.pause()
            clip.currentTime = 0

    def cue(self, number):
        self.stop(self.effect)
        self.effect = self.clips[number]
        self.effect.volume = 0.55
        self.play(self.effect)

    def set_muted(self, value):
        self.muted = value
        for clip in self.clips.values():
            clip.muted = value


class Dungeon:
    def __init__(self):
        build_screen()
        self.input = document["cmd"]
        self.log = document["log"]
        self.motion = window.matchMedia("(prefers-reduced-motion: reduce)")
        self.writer = TextQueue(self.log, self.motion)
        self.sound = Sound()
        self.timer = None
        document["form"].bind("submit", self.on_submit)
        document.bind("keydown", self.on_key)
        document.bind("pointerup", self.start_music)
        self.home()

    def start_music(self, event=None):
        music = self.sound.music
        if self.mode in ("home", "briefing", "play") and not self.sound.muted and music.paused:
            self.sound.play(music)

    def home(self):
        if self.timer is not None:
            window.clearTimeout(self.timer)
            self.timer = None
        self.sound.stop(self.sound.effect)
        self.sound.stop(self.sound.music)
        self.mode = "home"
        self.room = None
        self.lifted = False
        for name in ("blast", "reveal", "adventure"):
            document[name].hidden = True
        for name in ("heading", "controls", "home"):
            document[name].hidden = False
        document["home"].classList.remove("entering")
        document["prompt"].textContent = "Press Enter to enter the dungeon"
        document["controls"].textContent = "Type mute or unmute to control sound."
        self.input.disabled = False
        self.input.value = ""
        self.input.focus()
        self.start_music()

    def line(self, text, kind="", complete=None):
        self.writer.write(text, kind, complete, immediate=(self.mode == "home" or kind == "echo"))

    def enter_gate(self):
        self.start_music()
        if self.motion.matches:
            self.briefing()
        else:
            self.mode = "entering"
            self.input.disabled = True
            document["home"].classList.add("entering")
            self.timer = window.setTimeout(self.briefing, 800)

    def briefing(self):
        self.mode = "briefing"
        document["home"].classList.remove("entering")
        document["home"].hidden = True
        document["adventure"].hidden = False
        self.input.disabled = False
        self.input.focus()
        self.line("At the dungeon entrance", "location")
        self.line("From the dark comes a scrape, a thud, and a goblin whispering “Quiet!” to a flight of stairs.")
        self.line("Follow the trail through the dungeon and bring back your only way down.")
        document["prompt"].textContent = "Press Enter to follow the goblin"
        document["controls"].textContent = "You can type mute, unmute or restart."

    def show_scene(self, name):
        self.room = name
        scene = SCENES[name]
        self.line(scene["room"], "location")
        self.line(scene["text"])
        self.line(" ".join(f"[{i}] {choice[0]}" for i, choice in enumerate(scene["choices"], 1)), "choices")

    def choose(self, cmd):
        choices = SCENES[self.room]["choices"]
        for i, choice in enumerate(choices, 1):
            label, destination, result, *sounds = choice
            if cmd not in (str(i), label):
                continue
            self.line(result)
            if label == "lift stairs":
                self.lifted = True
            if sounds:
                self.sound.cue(sounds[0])
            if destination in ("alone", "together"):
                self.win(destination)
            else:
                self.show_scene(destination)
            return
        self.line("Try " + " or ".join(choice[0] for choice in choices) + ".")

    def win(self, ending):
        self.mode = "won"
        self.sound.stop(self.sound.effect)
        self.sound.stop(self.sound.music)
        if ending == "together":
            label = "HERO REWARD" if self.lifted else "FINGER DAMAGES SETTLED"
            self.line(f"The label reads {label}.")
        self.line("DUNGEON COMPLETE")
        document["prompt"].textContent = "Press Enter to open the bag"

    def open_bag(self):
        self.mode = "reveal"
        self.input.disabled = True
        document["reveal"].hidden = False
        self.sound.cue(17)
        self.timer = window.setTimeout(self.thank_you, 2000)

    def thank_you(self):
        self.sound.stop(self.sound.effect)
        document["reveal"].hidden = True
        self.mode = "closing"
        document["prompt"].textContent = ""
        document["controls"].hidden = True
        self.line("From behind the door: “That one usually works.”")
        self.line("THANK YOU FOR PLAYING.", complete=self.queue_blast)

    def queue_blast(self):
        self.timer = window.setTimeout(self.play_blast, 1300)

    def play_blast(self):
        self.mode = "blast"
        document["blast"].hidden = False
        self.frame_index = 0
        self.blast_frame()

    def blast_frame(self):
        if self.frame_index == len(BLAST_FRAMES):
            self.author_note()
            return
        document["sparks"].textContent = BLAST_FRAMES[self.frame_index]
        self.frame_index += 1
        self.timer = window.setTimeout(self.blast_frame, 100)

    def author_note(self):
        self.mode = "done"
        document["blast"].hidden = True
        document["heading"].hidden = True
        self.log.replaceChildren()
        document["prompt"].textContent = "Type restart to play again"
        self.input.value = ""
        self.input.disabled = False
        self.input.focus()
        for paragraph in AUTHOR_NOTE:
            self.line(paragraph, "author-note")

    def submit(self, raw):
        cmd = " ".join(raw.lower().split())
        if self.mode in ("entering", "reveal", "closing", "blast"):
            return
        if self.mode == "done":
            if cmd in ("", "restart"):
                self.writer.finish()
            if cmd == "restart":
                self.log.replaceChildren()
                self.home()
            return

        self.log.scrollTop = self.log.scrollHeight
        if self.writer.pending:
            self.writer.finish()
            if not cmd:
                return
        self.line("> " + raw if raw else ">", "echo")
        if cmd == "restart":
            self.home()
        elif cmd in ("mute", "unmute"):
            self.sound.set_muted(cmd == "mute")
            self.start_music()
            message = ("Sound off. Type unmute to restore audio." if self.sound.muted
                       else "Sound on. Type mute for silence.")
            self.line(message)
            if self.mode == "home":
                document["controls"].textContent = message
        elif self.mode == "home":
            if cmd in ("", "start"):
                self.enter_gate()
            else:
                document["controls"].textContent = "Press Enter with an empty prompt to start."
        elif self.mode == "briefing":
            if cmd in ("", "continue"):
                self.mode = "play"
                document["prompt"].textContent = ">"
                document["controls"].textContent = "Type a command or its number, then press Enter. You can also type mute, unmute or restart."
                self.start_music()
                self.show_scene("fork")
            else:
                self.line("Press Enter to continue.")
        elif self.mode == "won":
            if cmd in ("", "open bag"):
                self.open_bag()
        elif self.mode == "play":
            self.choose(cmd)

    def on_submit(self, event):
        event.preventDefault()
        raw = self.input.value
        self.input.value = ""
        self.submit(raw)

    def on_key(self, event):
        focused = document.activeElement == self.input
        if focused and not document["adventure"].hidden and event.key in ("PageUp", "PageDown"):
            event.preventDefault()
            direction = -1 if event.key == "PageUp" else 1
            self.log.scrollTop += direction * self.log.clientHeight
            return
        if event.key == "Enter":
            if event.repeat:
                event.preventDefault()
            elif not focused and self.mode in ("home", "briefing"):
                event.preventDefault()
                self.input.focus()
                self.submit("")
        self.start_music()
